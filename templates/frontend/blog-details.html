{% load static %}
<!DOCTYPE html>
<html lang="en">
    {% include 'frontend/include/header.html' %}
    <body>
        <!-- Preloader Start -->
        <div class="preloader">
            <div class="loading-container">
                <div class="loading"></div>
                <div id="loading-icon">
                    <img src="{% static 'assets/images/loader.svg' %}" alt="">
                </div>
            </div>
        </div>
        <!-- Preloader End -->
        <!-- Header Start -->
        {% include 'frontend/include/menu.html' %}
        <!-- Header End -->
        <!-- SubHeader Start-->
        <section class="page-subheader">
            <div class="container">
                <div class="row align-items-center justify-content-center wow fadeInUp">
                    <div class="col-lg-8">
                        <div class="section-title text-center mb-4">
                            <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
                                <span class="badge rounded-pill bg-light text-dark px-3 py-2">
                                    <i class="fa-regular fa-alarm-clock"></i>
                                    4 min read
                                </span>
                                <span class="badge rounded-pill bg-light text-dark px-3 py-2">
                                    <i class="fa-solid fa-tag"></i>
                                    Blog
                                </span>
                                <span class="badge rounded-pill bg-light text-dark px-3 py-2">
                                    <i class="fa-regular fa-calendar"></i>
                                    {{ blog.created_at|date:"d F Y" }}
                                </span>
                            </div>
                            <h1 class="text-white wow fadeInUp mb-4" data-wow-delay="0.2s">{{ blog.title }}</h1>
                           
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- SubHeader End-->
        <!-- Single Post Content Start -->
        <section class="section-row">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10  wow fadeInUp">
                        <div class="post-content">
                           <div class="mb-3"> {% if blog.image %}
                                <img src="{{ blog.image.url }}" alt="{{ blog.title }}" class="img-fluid rounded-4">
                                {% else %}
                                <img src="{% static 'assets/images/services/banner.jpg' %}" alt="{{ blog.title }}" class="img-fluid rounded-4">
                                {% endif %}</div>
                            <div class="post-entry">
                               
                        {{ blog.content|safe }}
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Post Content End -->
        <!-- Footer Start -->
        {% include 'frontend/include/footer.html' %}
    </body>
</html>
